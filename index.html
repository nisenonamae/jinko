<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#FFF7F4">

<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<style>
:root{--paper:#FFF7F4;--grid:#EFC6BC;--grid2:#F7DDD6;--ink:#1E2A38;--sub:#6B6460;--hit:#1F6B66;--miss:#C2372E;--card:#FFFFFF;--rule:#E6D3CC;
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);background:var(--paper);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--paper)}
body{margin:0;min-height:100vh;font-size:15px;line-height:1.65;font-variant-numeric:tabular-nums;
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);background-size:16px 16px;background-attachment:fixed}
main{max-width:640px;margin:0 auto;padding:1rem 1rem 6rem}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;border-bottom:2px solid var(--ink);padding-bottom:.4rem;margin-bottom:1rem}
header.top h1{margin:0;font-size:1.9rem;font-weight:900;letter-spacing:.06em}
header.top .st{font-size:.8rem;color:var(--sub);text-align:right}
.view[hidden]{display:none}
h2{font-size:1.05rem;margin:1.3rem 0 .5rem;font-weight:700}
.note{font-size:.82rem;color:var(--sub);margin:.3rem 0}
.box{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:.8rem .9rem;margin:.6rem 0}
.rx{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--ink);border-radius:2px;padding:.7rem .8rem .6rem;margin:.55rem 0;font:inherit;color:inherit;cursor:pointer}
.rx-h{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}.rx-h b{font-size:1.05rem}
.rx-k{font-size:.72rem;border:1px solid var(--ink);border-radius:2px;padding:0 .35rem;white-space:nowrap}
.rx-chain{font-size:.86rem;margin:.15rem 0 .35rem}.rx-chain i{font-style:normal;color:var(--sub)}
.rx-nums{display:flex;gap:1.1rem;flex-wrap:wrap;font-size:.78rem;color:var(--sub)}.rx-nums b{display:block;font-size:1.15rem;color:var(--ink)}
.trace{display:block;width:100%;height:96px;margin:.35rem 0 .2rem;background:#fff}
.trace.big{height:150px}
.trace .g1{stroke:var(--grid2);stroke-width:1}.trace .g5{stroke:var(--grid);stroke-width:1}
.trace .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.trace .lim{fill:none;stroke:var(--hit);stroke-width:1.2;stroke-dasharray:5 3}
.trace .ms{fill:var(--miss)}.trace .ok{fill:var(--ink)}
.f{margin:.5rem 0}.f label{display:block;font-size:.8rem;color:var(--sub);margin-bottom:.15rem}
input,select,textarea{font:inherit;color:inherit;width:100%;border:1px solid var(--rule);border-radius:2px;padding:.45rem .55rem;background:#fff}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.6rem 0}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:2px;padding:.45rem 1rem;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink)}.btn.sm{padding:.25rem .7rem;font-size:.86rem}.btn:disabled{opacity:.4}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:.3rem}.seg button{font:inherit;font-size:.86rem;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:2px;padding:.2rem .6rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.kv{display:grid;grid-template-columns:6.5rem 1fr;gap:.2rem .6rem;font-size:.88rem}.kv span{color:var(--sub)}
.tr{display:grid;grid-template-columns:5.4rem 3.2rem 1fr 4rem;gap:.4rem;font-size:.84rem;padding:.3rem 0;border-top:1px dashed var(--rule);align-items:baseline}
.tr .m{color:var(--miss);font-weight:700}.tr .h{color:var(--hit);font-weight:700}
.steps{padding-left:1.3rem;margin:.3rem 0}.steps li{margin:.5rem 0}
code,.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:#F4ECE8;padding:.05rem .3rem;border-radius:2px;word-break:break-all}
pre.code{display:block;white-space:pre-wrap;padding:.5rem .6rem;margin:.3rem 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--paper);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs button{flex:1;font:inherit;font-weight:700;background:none;border:0;padding:.75rem 0;color:var(--sub);cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.dojo{text-align:center;padding:1.6rem .5rem}
.dojo .big{font-size:3.2rem;font-weight:900;line-height:1.1}
.dojo .lab{font-size:.95rem;color:var(--sub);margin-top:.3rem}
.dojo .go{display:block;width:100%;font:inherit;font-size:1.3rem;font-weight:900;padding:1.4rem 0;margin:.8rem 0;border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:3px;cursor:pointer}
.dojo.cue .go{background:var(--ink);color:#fff}
.toast{position:fixed;left:50%;bottom:4.6rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem .9rem;border-radius:2px;font-size:.88rem;z-index:20;max-width:90vw}
.err{color:var(--miss)}
.ua{border-left:4px solid var(--miss)}
a.go{text-decoration:none;text-align:center}
details.box summary{cursor:pointer}
:focus-visible{outline:3px solid var(--hit);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>.se-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.5rem 0;font-size:.86rem}.se-btn{min-width:2.6rem;border:1px solid #bbb;border-radius:999px;background:#fff;padding:.1rem .7rem;font:inherit;cursor:pointer}.se-btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}.se-vol{display:flex;align-items:center;gap:.3rem}.se-vol input{width:8rem}</style>
</head>
<body>
<main>
<header class="top"><h1>人工反射</h1><div class="st" id="stamp">—</div></header>

<section class="view" id="v-run" hidden><div id="run"></div></section>
<section class="view" id="v-rx">
  <div id="rx-ua"></div>
  <div id="rx-list"></div>
  <div class="row" id="rx-new"><button type="button" class="btn ghost" data-new>+ 反射を作る</button></div>
  <div id="rx-form"></div>
</section>

<section class="view" id="v-dojo" hidden><div id="dojo"></div></section>
<section class="view" id="v-log" hidden><div id="log"></div></section>
<section class="view" id="v-cue" hidden><div id="cue"></div></section>

<section class="view" id="v-set" hidden>
  <h2>接続</h2>
  <div class="box">
    <p class="note">記録は、ほかのアプリと同じ非公開のリポジトリに置きます。トークンはこの端末にだけ保存されます。</p>
    <div class="f"><label>ユーザー名</label><input id="c-owner"></div>
    <div class="f"><label>リポジトリ</label><input id="c-repo" placeholder="notion-daily"></div>
    <div class="f"><label>ブランチ</label><input id="c-branch" placeholder="main"></div>
    <div class="f"><label>トークン</label><input id="c-token" type="password"></div>
    <div class="row"><button type="button" class="btn" id="connect">接続して読み込む</button><span class="note" id="c-msg"></span></div>
  </div>
  <h2>合図の通り道(ntfy)</h2>
  <div class="box" id="ntfy-box"></div>
  <h2>不快信号を止める通り道(MacroDroid)</h2>
  <div class="box">
    <p class="note">MacroDroid の「人工反射:解除」マクロの Webhook の URL を貼ります。この端末にだけ保存されます。</p>
    <div class="f"><label>Webhook の URL</label><input id="hook" placeholder="https://trigger.macrodroid.com/…/jinko"></div>
    <div class="row"><button type="button" class="btn sm" id="hook-save">保存する</button><button type="button" class="btn ghost sm" id="hook-test">解除を試す</button><span class="note" id="hook-msg"></span></div>
  </div>
  <h2>記録の受け口(MacroDroidから記録を送るとき)</h2>
  <div class="box" id="issue-box"></div>
  <p class="note" id="ver"></p>
</section>
</main>

<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-view="rx">反射</button>
  <button role="tab" aria-selected="false" data-view="dojo">道場</button>
  <button role="tab" aria-selected="false" data-view="log">記録</button>
  <button role="tab" aria-selected="false" data-view="cue">合図局</button>
  <button role="tab" aria-selected="false" data-view="set">設定</button>
</nav>

<script>
"use strict";
const APP_VERSION = "2026-10-24 j8";
const DATA = "roadmap/apps/jinko/data.json", LINE = id => "roadmap/apps/jinko/line-" + id + ".txt", KEY = "jinko-conn", KEY_LOCAL = "jinko-local";
const KINDS = { "人工": "① 人工の合図", "気づける": "② スマホが気づける場面", "再現": "③ 再現の稽古(A→B→C)" };
const state = { conn: null, data: null, sha: null, lineSha: {}, open: null, form: null, view: "rx", dojo: null, cues: [], run: null };
const CUES = date => "roadmap/apps/jinko/cues/" + date + ".json", HOMEWORDS = "roadmap/apps/jinko/home-words.txt", JST = 9 * 3600e3, jstDate = ms => new Date(ms + JST).toISOString().slice(0, 10);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const r1 = v => Math.round(v * 10) / 10;
const fmtS = v => v == null ? "—" : (v < 10 ? v.toFixed(2) : v.toFixed(1)) + "秒";
const md = iso => { const d = new Date(iso); return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
function toast(t){ const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
function blank(){ return { version: 1, issue: null, since: null, seen: [], reflexes: [], trials: [], skipped: [], ntfy: "" }; }
// 解除の動作:不快信号を止める動き。部品として取り替えられる(今はタップだけ。あとから種類を足す)
const STOPS = { "声で宣言": "やり終えたら、声に出して宣言する", "タップ": "やり終えたら、通知か画面をタップ" };
// 宣言の文(反射ごとに決められる。空なら「〇〇、やり終えた」)
const declOf = rx => String(rx.decl || "").trim() || ((rx.kind === "再現" ? rx.b.what : rx.c.what) + "、やり終えた");
// 聞き取った文と宣言の文を比べる:空白・句読点を除いて、含まれているか、だいたい同じなら通す
const normJ = s => String(s || "").replace(/[\s、。,.!?!?「」『』・ー-]/g, "").toLowerCase();
function similar(a, b){ a = normJ(a); b = normJ(b); if (!a || !b) return 0; if (a.includes(b)) return 1;
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i].concat(Array(n).fill(0))); for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return 1 - d[m][n] / Math.max(m, n); }
// MacroDroid の Webhook(この端末だけの URL)。タップしたら呼んで、不快信号を止める
const hookUrl = () => (lsGet("jinko-hook", "") || "").trim();
function callHook(params){ const u = hookUrl(); if (!u) return Promise.resolve(false);
  const q = Object.entries(params).map(([k, v]) => encodeURIComponent(k) + "=" + encodeURIComponent(v)).join("&");
  return fetch(u + (u.includes("?") ? "&" : "?") + q, { mode: "no-cors", cache: "no-store" }).then(() => true, () => false); }
// Cで開くもの:ウェブのアドレスか、Androidのアプリの名前(パッケージ名)
const openHref = o => { o = String(o || "").trim(); if (!o) return ""; if (/^https?:\/\//.test(o) || /^intent:/.test(o)) return o; if (/^[a-z][\w]*(\.[\w]+)+$/i.test(o)) return "intent:#Intent;package=" + o + ";end"; return ""; };

/* ───────── GitHub ───────── */
const api = () => "https://api.github.com/repos/" + encodeURIComponent(state.conn.owner) + "/" + encodeURIComponent(state.conn.repo);
const hdr = extra => Object.assign({ Authorization: "Bearer " + state.conn.token, Accept: "application/vnd.github+json" }, extra || {});
const b64e = s => { const b = new TextEncoder().encode(s); let x = ""; b.forEach(c => x += String.fromCharCode(c)); return btoa(x); };
const b64d = s => { const x = atob(String(s).replace(/\s/g, "")), u = new Uint8Array(x.length); for (let i = 0; i < x.length; i++) u[i] = x.charCodeAt(i); return new TextDecoder().decode(u); };
async function gh(path, opts){ const r = await fetch(api() + path, Object.assign({ cache: "no-store" }, opts || {}, { headers: hdr((opts || {}).headers) }));
  if (!r.ok) { const e = new Error(r.status === 401 ? "トークンが無効です" : "GitHubとの通信に失敗しました(" + r.status + ")"); e.status = r.status; throw e; } return r.status === 204 ? null : r.json(); }
async function readFile(p){ try { const j = await gh("/contents/" + p + "?ref=" + encodeURIComponent(state.conn.branch)); return { text: b64d(j.content), sha: j.sha }; } catch (e) { if (e.status === 404) return { text: null, sha: null }; throw e; } }
async function writeFile(p, text, sha, msg){ const j = await gh("/contents/" + p, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ message: msg || "人工反射", content: b64e(text), branch: state.conn.branch }, sha ? { sha } : {})) }); return j.content.sha; }
async function save(mutate){
  if (mutate) mutate(state.data);
  lsSet(KEY_LOCAL, state.data); render();
  if (!state.conn) return;
  for (let i = 0; i < 3; i++) {
    try { state.sha = await writeFile(DATA, JSON.stringify(state.data), state.sha); lsSet(KEY_LOCAL, state.data); return; }
    catch (e) { if ((e.status === 409 || e.status === 422) && i < 2) { const f = await readFile(DATA); const fresh = f.text ? JSON.parse(f.text) : blank(); state.sha = f.sha; if (mutate) mutate(fresh); state.data = norm(fresh); continue; } toast(e.message); return; }
  }
}
const norm = d => Object.assign(blank(), d || {});

/* ───────── 記録の取り込み:Issue のコメント1つ = 1回分 ─────────
   形:「人工反射 RF1 稽古 b=4.2 c=1.8」(秒。外れは b=外れ / c=外れ。① ② は c だけ) */
function parseComment(body){
  const t = String(body || "").trim().split(/\s+/); if (t[0] !== "人工反射" || !t[1]) return null;
  const out = { r: t[1], mode: t[2] === "本番" ? "本番" : "稽古", b: null, c: null, miss: null };
  t.slice(2).forEach(x => { const m = /^([bc])=(.+)$/.exec(x); if (!m) return; const v = m[2];
    if (/^(外れ|miss|x|-)$/i.test(v)) { out[m[1]] = null; out.miss = out.miss || m[1].toUpperCase(); } else if (!isNaN(+v)) out[m[1]] = +v; });
  return out;
}
async function importLog(){
  const D = state.data; if (!state.conn || !D.issue) return 0;
  let page = 1, added = 0, newest = D.since; const seen = new Set(D.seen || []);
  for (; page <= 20; page++) {
    const list = await gh("/issues/" + D.issue + "/comments?per_page=100&page=" + page + (D.since ? "&since=" + encodeURIComponent(D.since) : ""));
    (list || []).forEach(cm => { if (seen.has(cm.id)) return; const p = parseComment(cm.body); seen.add(cm.id); if (!p) return;
      const rx = D.reflexes.find(x => x.id === p.r); if (!rx) return;
      D.trials.push(Object.assign({ cid: cm.id, at: cm.created_at, limit: rx.limit }, p)); added++;
      if (!newest || cm.created_at > newest) newest = cm.created_at; });
    if (!list || list.length < 100) break;
  }
  D.since = newest; D.seen = Array.from(seen).slice(-400);
  D.trials.sort((a, b) => a.at < b.at ? -1 : 1); if (D.trials.length > 6000) D.trials = D.trials.slice(-6000);
  return added;
}
/* 当たりの線:最近20回の B→C(または合図→動き)の秒数の、速いほうから75%の位置。当たりがだいたい4回に3回になる、ぎりぎりの難しさ */
function nextLimit(rx){
  if (!rx.autoShrink) return rx.limit;   // 不快信号までの時間は自分で決める。自動で縮めるのは、選んだ反射だけ
  const ts = state.data.trials.filter(t => t.r === rx.id && t.c != null).slice(-20).map(t => t.c).sort((a, b) => a - b);
  if (ts.length < 5) return rx.limit;
  const q = ts[Math.min(ts.length - 1, Math.floor(ts.length * 0.75))];
  return Math.max(0.3, Math.min(rx.limit0, r1(q)));
}
async function sync(){
  const msg = $("c-msg");
  try {
    const f = await readFile(DATA); state.data = norm(f.text ? JSON.parse(f.text) : lsGet(KEY_LOCAL, null)); state.sha = f.sha;
    const added = await importLog();
    let changed = added > 0;
    for (const rx of state.data.reflexes.filter(x => !x.archived)) {
      const nl = nextLimit(rx); if (nl !== rx.limit) { rx.limit = nl; (rx.limitLog = rx.limitLog || []).push({ d: new Date().toISOString(), v: nl }); changed = true; }
      const lf = await readFile(LINE(rx.id)); state.lineSha[rx.id] = lf.sha;
      if ((lf.text || "").trim() !== String(rx.limit)) state.lineSha[rx.id] = await writeFile(LINE(rx.id), String(rx.limit), lf.sha, "人工反射:当たりの線");
    }
    const now = Date.now(); state.cues = [];
    for (const day of [jstDate(now - 864e5), jstDate(now)]) { try { const cf = await readFile(CUES(day)); if (cf.text) state.cues = state.cues.concat(JSON.parse(cf.text).cues || []); } catch (x) {} }
    state.cues.sort((a, b) => a.at - b.at);
    // 家でしかできない反射の「合図の文」を、MacroDroid が読める形で書き出す(1行に1つ)
    const homeWords = state.data.reflexes.filter(x => !x.archived && x.homeOnly).map(x => (x.kind === "再現" ? x.b.what : x.c.what)).filter(Boolean).join("\n");
    try { const hf = await readFile(HOMEWORDS); if ((hf.text || "").trim() !== homeWords.trim()) await writeFile(HOMEWORDS, homeWords, hf.sha, "人工反射:家でしかできない反射"); } catch (x) {}
    if (changed || !f.sha) await save();
    lsSet(KEY_LOCAL, state.data);
    if (msg) { msg.textContent = "読み込みました" + (added ? "(新しい記録 " + added + "件)" : ""); msg.className = "note"; }
  } catch (e) { if (msg) { msg.textContent = e.message; msg.className = "note err"; } }
  render();
}
async function makeIssue(){
  const j = await gh("/issues", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title: "人工反射の記録", body: "人工反射の合図局(MacroDroid)が、1回ごとに1つのコメントを足す場所です。このIssueは閉じずに置いておいてください。" }) });
  await save(d => { d.issue = j.number; });
}

/* ───────── 計算 ───────── */
const median = a => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const spread = a => { if (a.length < 4) return null; const s = a.slice().sort((x, y) => x - y); return s[Math.floor(s.length * 0.75)] - s[Math.floor(s.length * 0.25)]; };
const isHit = t => t.c != null && t.c <= (t.limit || Infinity) + 1e-9;
function statsOf(rx){
  const all = state.data.trials.filter(t => t.r === rx.id), recent = all.slice(-20), cs = all.filter(t => t.c != null).map(t => t.c);
  const first = cs.slice(0, 10), last = cs.slice(-10);
  let streak = 0; for (let i = all.length - 1; i >= 0 && isHit(all[i]); i--) streak++;
  const half = (() => { if (!rx.limitLog) return null; const h = rx.limitLog.find(x => x.v <= rx.limit0 / 2); return h ? Math.round((Date.parse(h.d) - Date.parse(rx.created)) / 864e5) : null; })();
  const real = all.filter(t => t.mode === "本番");

/* ───────── 波形:方眼の上に、反応までの秒数を記録紙のように描く ───────── */

  for (let y = 0; y <= H; y += 12) g += '<line class="' + (y % 60 ? "g1" : "g5") + '" x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '"/>';

    '<polyline class="lim" points="' + lim + '"/><polyline class="ln" points="' + pts + '"/>' + dots + "</svg>";
}

/* ───────── 道場:アプリを開いているあいだの稽古。いつ来るか分からない合図で、その場で測る ───────── */

const dojoDelay = () => window.__jinkoFast ? 60 : 3000 + Math.random() * 37000;   // 3〜40秒のどこか(いつ来るか分からない)

/* ───────── 合図から開いたとき ─────────

/* 声の聞き取り(Chrome の聞き取りの機能) */
let rec = null;

function listen(){ const Sp = window.SpeechRecognition || window.webkitSpeechRecognition, R = state.run, { rx } = runCtx();

}

      else { const n = d.reflexes.reduce((m, x) => Math.max(m, +String(x.id).replace(/\D/g, "") || 0), 0) + 1;
        d.reflexes.push({ id: "RF" + n, name: f.name.trim(), kind: f.kind, a: (f.a || "").trim(), b: { what: (f.bwhat || "").trim(), mark: (f.bmark || "").trim() }, c: { what: f.cwhat.trim(), judge: f.judge, app: (f.app || "").trim(), open: (f.open || "").trim() },
          limit0: lim, limit: lim, limitLog: [{ d: new Date().toISOString(), v: lim }], perDay: +f.perDay || 12, quiet: (f.quiet || "").trim(), stop: f.stop || "タップ", minTime: Math.max(0, +f.minTime || 0), decl: (f.decl || "").trim(), randomFire: f.randomFire !== false, autoShrink: !!f.autoShrink, homeOnly: !!f.homeOnly, created: new Date().toISOString() }); } });
    state.form = null; render(); return; }
  if ((b = q("[data-open]"))) { state.open = b.dataset.open; render(); return; }
  if (q("[data-close]")) { state.open = null; render(); return; }
  if ((b = q("[data-edit]"))) { const rx = state.data.reflexes.find(x => x.id === b.dataset.edit);
    state.form = { id: rx.id, name: rx.name, kind: rx.kind, a: rx.a, bwhat: rx.b.what, bmark: rx.b.mark, cwhat: rx.c.what, judge: rx.c.judge, app: rx.c.app, open: rx.c.open, stop: rx.stop, minTime: rx.minTime, decl: rx.decl, randomFire: rx.randomFire, autoShrink: rx.autoShrink, homeOnly: rx.homeOnly, limit0: rx.limit0, perDay: rx.perDay, quiet: rx.quiet }; state.open = null; render(); return; }
  if ((b = q("[data-archive]"))) { if (!confirm("この反射をしまいますか(記録は残ります)。")) return; const id = b.dataset.archive; await save(d => { d.reflexes.find(x => x.id === id).archived = new Date().toISOString(); }); state.open = null; render(); return; }
  if ((b = q("[data-dojo-go]"))) { state.dojo = { r: b.dataset.dojoGo, on: false }; showView("dojo"); return; }
  if ((b = q("[data-cue-go]"))) { state.cueFor = b.dataset.cueGo; showView("cue"); return; }
  if (q("[data-dojo-start]")) { state.dojo = Object.assign(state.dojo || {}, { on: true, count: 0, last: null }); beep("hit"); dojoArm(); return; }
  if (q("[data-dojo-tap]")) { dojoTap(); return; }
  if (q("[data-dojo-stop]")) { const d = state.dojo; clearTimeout(d.timer); clearTimeout(d.out); d.on = false;
    const rxs = state.data.reflexes.filter(x => !x.archived); rxs.forEach(rx => { const nl = nextLimit(rx); if (nl !== rx.limit) { rx.limit = nl; (rx.limitLog = rx.limitLog || []).push({ d: new Date().toISOString(), v: nl }); } });
    await save(); if (state.conn) for (const rx of rxs) { try { const lf = await readFile(LINE(rx.id)); if ((lf.text || "").trim() !== String(rx.limit)) await writeFile(LINE(rx.id), String(rx.limit), lf.sha, "人工反射:当たりの線"); } catch (x) {} }
    toast(d.count + "回の稽古を記録しました"); renderDojo(); return; }
  if (e.target.id === "connect") { const c = { owner: $("c-owner").value.trim(), repo: $("c-repo").value.trim() || "notion-daily", branch: $("c-branch").value.trim() || "main", token: $("c-token").value.trim() };
    if (!c.owner || !c.token) { $("c-msg").textContent = "ユーザー名とトークンを入れてください"; return; } state.conn = c; lsSet(KEY, c); await sync(); return; }
  if (e.target.id === "mkissue") { try { await makeIssue(); toast("記録の受け口を作りました"); } catch (x) { toast(x.message); } return; }
  if (e.target.id === "reimport") { await sync(); return; }
  if (e.target.id === "hook-save") { lsSet("jinko-hook", $("hook").value.trim()); $("hook-msg").textContent = "保存しました"; return; }
  if (e.target.id === "hook-test") { const ok2 = await callHook({ kaijo: 1, test: 1 }); $("hook-msg").textContent = ok2 ? "送りました(スマホが短く振動すれば成功)" : "URLを入れてください"; return; }
  if (e.target.id === "ntfy-make") { const a = new Uint8Array(12); crypto.getRandomValues(a); $("ntfy-topic").value = "jinko-" + Array.from(a, x => x.toString(36).padStart(2, "0")).join("").slice(0, 20); return; }
  if (e.target.id === "ntfy-save") { const v = $("ntfy-topic").value.trim(); await save(d => { d.ntfy = v; }); toast("保存しました"); return; }
  if ((b = q("[data-ua-miss]"))) { const id = b.dataset.uaMiss, c = state.cues.find(x => x.id === id);
    await save(d => { d.trials.push({ cue: id, at: new Date(c.at).toISOString(), r: c.r, mode: "合図", b: null, c: null, miss: "応答なし", limit: (d.reflexes.find(x => x.id === c.r) || {}).limit }); d.trials.sort((x, y) => x.at < y.at ? -1 : 1); }); return; }
  if ((b = q("[data-ua-skip]"))) { const id = b.dataset.uaSkip; await save(d => { d.skipped = (d.skipped || []).concat([id]).slice(-500); }); return; }
  if (q("[data-run-stop]")) { beep("miss"); runFinish(Date.now()); return; }
  if (q("[data-run-listen]")) { listen(); return; }
  if (q("[data-run-close]")) { state.run = null; showView("rx"); return; }
});

(function boot(){
  const P = new URLSearchParams(location.search);
  if ((P.get("cue") && P.get("at")) || P.get("src") === "esc") { state.run = { id: P.get("cue"), r: P.get("r"), at: +P.get("at") || Date.now(), src: P.get("src") || "", home: P.get("home") === "1", tap: Date.now(), perf: performance.now() }; try { history.replaceState(null, "", location.pathname); } catch (e) {} }
  state.conn = lsGet(KEY, null); state.data = norm(lsGet(KEY_LOCAL, null));
  $("hook").value = hookUrl();
  if (state.conn) { $("c-owner").value = state.conn.owner; $("c-repo").value = state.conn.repo; $("c-branch").value = state.conn.branch; $("c-token").value = state.conn.token; }
  if (state.run) { state.view = "run"; document.querySelectorAll(".view").forEach(x => { x.hidden = x.id !== "v-run"; }); $("run").innerHTML = '<div class="dojo cue"><div class="big" style="font-size:1.4rem">読み込んでいます</div></div>';
    (state.conn ? sync() : Promise.resolve()).then(() => { state.ready = true; renderRun(); }); }
  else { state.ready = true; render(); if (state.conn) sync(); else showView("set"); }
  if ("serviceWorker" in navigator && !window.__jinkoTest && location.protocol === "https:") navigator.serviceWorker.register("./sw.js").catch(() => {});
  window.__jinko = { state, parseComment, nextLimit, statsOf, sync, importLog, openHref, callHook, STOPS, similar, declOf, HOMEWORDS };
})();

<script>
/* ───── 効果音(省・行軍表・関所・国力年報と同じ音。入/切と音量はアプリどうしで共通) ───── */

// ───────── 効果音(ブラウザの中で音を合成。音のファイルは使わない)─────────
// 設定(入/切・音量)は 3つのアプリで共通(localStorage の se-on / se-vol)
const SE = (() => {
  let ctx = null, master = null, lastTap = 0, lastErr = 0;
  const ls = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
  let on = ls("se-on", "1") !== "0", vol = Math.max(0, Math.min(1, +ls("se-vol", "0.5")));
  function ac(){
    if (!on) return null;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    if (!ctx) { ctx = new AC(); master = ctx.createGain(); master.connect(ctx.destination); }
    if (ctx.state === "suspended") ctx.resume();
    master.gain.value = vol * 0.9;
    return ctx;
  }
  // 1つの音:周波数 f(滑らせるなら f2)、始まり t、長さ d、波の形、大きさ g
  function note(c, f, t, d, o){
    o = o || {};
    const osc = c.createOscillator(), gn = c.createGain(), t0 = c.currentTime + (t || 0);
    osc.type = o.type || "sine"; osc.frequency.setValueAtTime(f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + d);
    const g = o.g == null ? 0.2 : o.g, a = o.a == null ? 0.005 : o.a;
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(g, t0 + a);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    let last = gn;
    if (o.lp) { const fl = c.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = o.lp; gn.connect(fl); last = fl; }
    osc.connect(gn); last.connect(master); osc.start(t0); osc.stop(t0 + d + 0.05);
  }
  // 鐘のような音(基音 + 倍音)
  const bell = (c, f, t, d, g) => { note(c, f, t, d, { g: g }); note(c, f * 2, t, d * 0.6, { g: g * 0.35 }); note(c, f * 3.01, t, d * 0.3, { g: g * 0.12 }); };
  // ざわめき(風・波)
  function noise(c, t, d, o){
    o = o || {};
    const n = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, n, c.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(), fl = c.createBiquadFilter(), gn = c.createGain(), t0 = c.currentTime + (t || 0);
    src.buffer = buf; fl.type = o.type || "lowpass"; fl.Q.value = o.q || 0.7;
    fl.frequency.setValueAtTime(o.f || 400, t0); if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t0 + d * 0.8);
    const g = o.g || 0.08;
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(g, t0 + d * 0.35); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    src.connect(fl); fl.connect(gn); gn.connect(master); src.start(t0); src.stop(t0 + d + 0.05);
  }
  const lib = {
    tap: c => note(c, 880, 0, 0.05, { f2: 660, g: 0.05 }),
    tab: c => { note(c, 520, 0, 0.07, { type: "triangle", g: 0.07 }); note(c, 780, 0.03, 0.06, { type: "triangle", g: 0.04 }); },
    toggleOn: c => note(c, 600, 0, 0.08, { f2: 1150, g: 0.08 }),
    toggleOff: c => note(c, 900, 0, 0.08, { f2: 480, g: 0.06 }),
    done: c => { bell(c, 1046.5, 0, 0.45, 0.11); bell(c, 1318.5, 0.08, 0.6, 0.11); },
    save: c => { bell(c, 784, 0, 0.35, 0.08); bell(c, 1174.7, 0.01, 0.4, 0.06); },
    remove: c => note(c, 520, 0, 0.14, { f2: 240, type: "triangle", g: 0.08 }),
    error: c => { note(c, 220, 0, 0.09, { type: "square", g: 0.05, lp: 900 }); note(c, 196, 0.12, 0.12, { type: "square", g: 0.05, lp: 900 }); },
    open: c => noise(c, 0, 0.18, { f: 300, f2: 2400, type: "bandpass", q: 1.2, g: 0.05 }),
    fanfare: c => { [523.25, 659.25, 783.99].forEach((f, i) => { note(c, f, i * 0.09, 0.3, { type: "triangle", g: 0.12 }); note(c, f * 2, i * 0.09, 0.2, { g: 0.03 }); });
      bell(c, 1046.5, 0.27, 1.1, 0.13); note(c, 523.25, 0.27, 1.0, { type: "triangle", g: 0.06 });
      [2093, 2637, 3136, 2637].forEach((f, i) => note(c, f, 0.45 + i * 0.07, 0.25, { g: 0.025 })); },
    levelup: c => { note(c, 600, 0, 0.5, { f2: 1600, type: "triangle", g: 0.08 }); [1568, 1975.5, 2349.3, 3136].forEach((f, i) => bell(c, f, 0.35 + i * 0.06, 0.4, 0.04)); },
    issue: c => { [392, 523.25, 659.25, 783.99].forEach((f, i) => note(c, f, i * 0.12, i === 3 ? 0.9 : 0.22, { type: "sawtooth", g: 0.07, lp: 1800, a: 0.02 }));
      note(c, 196, 0.36, 0.9, { type: "sawtooth", g: 0.04, lp: 700, a: 0.03 }); },
    swell: c => { noise(c, 0, 0.9, { f: 200, f2: 1400, g: 0.05 }); [440, 554.4, 659.3].forEach(f => note(c, f, 0.05, 0.9, { g: 0.035, a: 0.35 })); },
    unswell: c => { noise(c, 0, 0.6, { f: 1200, f2: 250, g: 0.04 }); note(c, 554.4, 0, 0.5, { f2: 440, g: 0.04, a: 0.1 }); },
    pluck: c => { note(c, 880, 0, 0.35, { type: "triangle", g: 0.09, a: 0.002 }); note(c, 1318.5, 0.05, 0.4, { type: "triangle", g: 0.06, a: 0.002 }); },
    link: c => { note(c, 659.3, 0, 0.25, { type: "triangle", g: 0.08, a: 0.002 }); note(c, 987.8, 0.09, 0.35, { type: "triangle", g: 0.08, a: 0.002 }); },
    lock: c => { note(c, 180, 0, 0.06, { type: "square", g: 0.05, lp: 1200 }); note(c, 120, 0.05, 0.08, { type: "square", g: 0.05, lp: 900 }); },
    unlock: c => { note(c, 160, 0, 0.05, { type: "square", g: 0.05, lp: 1200 }); bell(c, 1318.5, 0.08, 0.45, 0.07); },
    send: c => noise(c, 0, 0.25, { f: 2400, f2: 400, type: "bandpass", q: 1.5, g: 0.06 }),
    down: c => { note(c, 660, 0, 0.25, { f2: 440, type: "triangle", g: 0.07 }); },
  };
  function play(name, opt){
    try {
      const c = ac(); if (!c || !lib[name]) return;
      if (name === "tap" || name === "tab") { const now = Date.now(); if (now - lastTap < 45) return; lastTap = now; }
      if (name === "error") { const now = Date.now(); if (now - lastErr < 500) return; lastErr = now; }
      lib[name](c, opt);
    } catch (e) {}
  }
  // 場面の見分け:アプリごとの [選び方, 音] の並び(上から順に見る)
  let rules = [];
  function soundFor(el){
    for (const [sel, snd] of rules) { const hit = el.closest(sel); if (hit) return typeof snd === "function" ? snd(hit) : snd; }
    const inp = el.closest("input");
    if (inp && (inp.type === "checkbox" || inp.type === "radio")) return inp.checked ? "toggleOn" : "toggleOff";
    if (el.closest("nav button, [role=tab], .tabs button")) return "tab";
    if (el.closest("button, a[href], summary, .chip-b, [data-v]")) return "tap";
    return null;
  }
  function init(appRules){
    rules = appRules || [];
    document.addEventListener("click", e => { const s = e.target && e.target.closest ? soundFor(e.target) : null; if (s) play(s); }, true);
    // エラーの表示(class="err")が出たら、低い音
    try {
      new MutationObserver(ms => { for (const m of ms) { const el = m.target.nodeType === 1 ? m.target : m.target.parentElement; if (!el || !el.closest) continue;
        const er = el.closest(".err"); if (er && (er.textContent || "").trim()) { play("error"); break; } } })
        .observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["class"] });
    } catch (e) {}
  }
  // 設定の欄(入/切・音量)。アプリの版の表示のそばに置く
  function mount(anchor){
    if (!anchor || document.getElementById("se-row")) return;
    const row = document.createElement("div"); row.id = "se-row"; row.className = "se-row";
    row.innerHTML = '<span>効果音</span><button type="button" id="se-on" class="se-btn"></button><label class="se-vol">音量 <input id="se-vol" type="range" min="0" max="1" step="0.05"></label>';
    anchor.parentNode.insertBefore(row, anchor.nextSibling);
    const b = row.querySelector("#se-on"), r = row.querySelector("#se-vol");
    const show = () => { b.textContent = on ? "入" : "切"; b.setAttribute("aria-pressed", String(on)); r.value = vol; r.disabled = !on; };
    b.addEventListener("click", () => { on = !on; try { localStorage.setItem("se-on", on ? "1" : "0"); } catch (e) {} show(); if (on) play("toggleOn"); });
    r.addEventListener("input", () => { vol = +r.value; try { localStorage.setItem("se-vol", String(vol)); } catch (e) {} });
    r.addEventListener("change", () => play("done"));
    show();
  }
  return { play, init, mount, soundFor, get on(){ return on; } };
})();

SE.init([
  ["[data-save], #ntfy-save, #hook-save", "save"],
  ["[data-archive], [data-ua-miss]", "remove"],
  ["[data-open], [data-new], [data-edit], [data-cue-go], [data-dojo-go]", "open"],
  ["[data-close], [data-cancel], [data-run-close], [data-ua-skip]", "tab"],
  ["#connect, #reimport, #mkissue, #hook-test, #ntfy-make", "open"],
  ["[data-seg] [data-v]", el => el.getAttribute("aria-pressed") === "true" ? "toggleOff" : "toggleOn"],
  ["nav.tabs button", "tab"]
]);
(function(){ const go = () => SE.mount(document.getElementById("ver")); if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else go(); })();
</script>
